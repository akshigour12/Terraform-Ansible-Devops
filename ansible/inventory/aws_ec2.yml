---
plugin: amazon.aws.aws_ec2

regions:
  - ap-south-1

filters:
  instance-state-name:
    - running

hostnames:
  - ip-address

compose:
  ansible_host: public_ip_address
  ansible_user: "'ubuntu' if tags.OS == 'ubuntu' else ('ec2-user' if tags.OS == 'amazonlinux' else 'admin')"

keyed_groups:
  - key: tags.Role
    prefix: role
    separator: "_"

  - key: tags.OS
    prefix: os
    separator: "_"
